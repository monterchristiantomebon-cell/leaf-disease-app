<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supported Crops - Leaf Disease Detection</title>
  <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='image/icon-512.png') }}">
  <style>
    
    /* Dark Theme Base Styling */
    body {
      background-color: #121915;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .title {
      color: #a8e6cf;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #a0a0a0;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    /* Navigation / Breadcrumb Controls */
    .nav-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      min-height: 40px;
    }

    /* Navigation Action Buttons */
    .btn-action {
      background-color: #213028;
      color: #a8e6cf;
      border: 1px solid #324a3e;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .btn-action:hover {
      background-color: #2c4237;
      border-color: #436353;
      color: #ffffff;
    }

    /* Hide Utility */
    .hidden {
      display: none !important;
    }

    .breadcrumb {
      color: #888;
      font-size: 0.95rem;
      margin-left: 0.5rem;
    }

    .breadcrumb span {
      color: #ffffff;
      font-weight: 600;
    }

    /* Card Grid Setup */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
    }

    /* Card Item Styles */
    .item-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .item-card:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .media-container {
      width: 100%;
      height: 160px;
      border-radius: 6px;
      overflow: hidden;
      background-color: #151d19;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.75rem;
    }

    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .folder-icon {
      font-size: 3.5rem;
      color: #a8e6cf;
    }

    .card-title {
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      word-break: break-word;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: #777;
      padding: 3rem 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="title">Leaf Disease Detection Using Image Processing</h1>
  <p class="subtitle">Our machine learning model currently supports automated disease detection for the following crop species:</p>

  <div class="nav-bar">
    <!-- Home button returning directly to root / index.html -->
    <a href="/" class="btn-action">🏠 Home</a>

    <!-- Level Back button (hidden on main crop list) -->
    <button id="backBtn" class="btn-action hidden" onclick="goBack()">← Back</button>

    <div id="breadcrumb" class="breadcrumb">Showing <span>All Crops</span></div>
  </div>

  <div id="contentGrid" class="card-grid"></div>
</div>

<script>
  let currentLevel = 'crops'; // 'crops' | 'folders'
  let activeCrop = null;

  const contentGrid = document.getElementById('contentGrid');
  const backBtn = document.getElementById('backBtn');
  const breadcrumb = document.getElementById('breadcrumb');

  // LEVEL 1: Render Crop List via API
  async function loadCrops() {
    currentLevel = 'crops';
    activeCrop = null;
    
    // Hide level Back button on main level
    backBtn.classList.add('hidden');
    breadcrumb.innerHTML = 'Showing <span>All Crops</span>';
    contentGrid.innerHTML = '';

    try {
      const res = await fetch('/api/crops');
      const crops = await res.json();

      if (!crops || crops.length === 0) {
        contentGrid.innerHTML = '<div class="empty-msg">No crops available in dataset.</div>';
        return;
      }

      crops.forEach(crop => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.onclick = () => showCropDetails(crop.name);

        const iconHtml = crop.icon
          ? `<img src="${crop.icon}" alt="${crop.name}" onerror="this.parentElement.innerHTML='🌿';">`
          : '<span style="font-size: 3rem;">🌿</span>';

        card.innerHTML = `
          <div class="media-container">${iconHtml}</div>
          <div class="card-title">${crop.name}</div>
        `;
        contentGrid.appendChild(card);
      });
    } catch (err) {
      contentGrid.innerHTML = '<div class="empty-msg">Failed to load crop dataset.</div>';
    }
  }

  // LEVEL 2: Render Disease Folders inside Selected Crop
  async function showCropDetails(cropName) {
    currentLevel = 'folders';
    activeCrop = cropName;

    // Show level Back button
    backBtn.classList.remove('hidden');

    // Update breadcrumb text
    breadcrumb.innerHTML = `Crops > <span>${cropName}</span>`;
    contentGrid.innerHTML = '';

    try {
      const res = await fetch(`/api/crops/${encodeURIComponent(cropName)}/folders`);
      const folders = await res.json();

      if (!folders || folders.length === 0) {
        contentGrid.innerHTML = `<div class="empty-msg">No disease categories registered for ${cropName}.</div>`;
        return;
      }

      folders.forEach(folder => {
        const card = document.createElement('div');
        card.className = 'item-card';
        
        card.onclick = () => {
          window.location.href = `/crops/${encodeURIComponent(folder.id)}`;
        };

        const mediaHtml = folder.icon 
          ? `<img src="${folder.icon}" alt="${folder.name}" onerror="this.parentElement.innerHTML='<div class=\\'folder-icon\\'>📁</div>';">`
          : `<div class="folder-icon">📁</div>`;

        card.innerHTML = `
          <div class="media-container">${mediaHtml}</div>
          <div class="card-title">${folder.name}</div>
        `;
        contentGrid.appendChild(card);
      });
    } catch (err) {
      contentGrid.innerHTML = '<div class="empty-msg">Error loading disease categories.</div>';
    }
  }

  // Back Button Function for Drill-down Hierarchy
  function goBack() {
    loadCrops();
  }

  // Initial Load
  loadCrops();
</script>

</body>
</html>
